name: Format

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-format:
    name: Clang Format
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install formatting tools
        run: brew install ninja clang-format

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DWARNINGS_AS_ERRORS=ON \
            -DARIADNE_CLANG_FORMAT_EXECUTABLE="$(brew --prefix)/bin/clang-format"

      - name: Check C++ formatting
        run: cmake --build "${{ runner.workspace }}/build" --target check-format
