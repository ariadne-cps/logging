name: Windows

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Windows 2025 x86 MSVC", os: windows-2025, arch: x64 }
          - { name: "Windows 11 arm MSVC", os: windows-11-arm, arch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Configure CMake
        run: |
          # /Z7 embeds Debug symbols in .obj files, avoiding parallel MSVC compiler PDB writes.
          # Keep /Ob0, /Od and /RTC1 from CMake's standard Debug flags.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" `
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build build --parallel --target ariadne-logging

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install build --prefix "${{ runner.workspace }}/install"

      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: cmake --build build --parallel --target tests

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build --output-on-failure
