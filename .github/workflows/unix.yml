name: Unix

on:
  push:
    branches:
      - main
      - coverage
  pull_request:

env:
  BUILD_TYPE: Release

jobs:
  build:

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "macOS 26 AppleClang 21 [Release]",
            os: macos-26,
            cxx: "/usr/bin/clang++"
          }
          - {
            name: "Ubuntu 24.04 Clang 16 [Release]",
            os: ubuntu-24.04,
            cxx: "clang++-16"
          }
          - {
            name: "Ubuntu 24.04 GCC 12 [Release]",
            os: ubuntu-24.04,
            cxx: "g++-12"
          }

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Get macOS Concurrency
      if: runner.os == 'macOS'
      run: |
        echo NPROC="sysctl -n hw.ncpu" >> $GITHUB_ENV
        echo "Running on $(sysctl -n hw.ncpu) threads ..."

    - name: Get Linux Concurrency
      if: runner.os == 'Linux'
      run: |
        echo NPROC="nproc" >> $GITHUB_ENV
        echo "Running on $(nproc) threads ..."

    - name: Set Up macOS Dependencies
      if: runner.os == 'macOS'
      run: |
        brew install ninja
        export PKG_CONFIG_PATH=/usr/local/opt/libffi/lib/pkgconfig

    - name: Set Up Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt install -y cmake ninja-build pkg-config clang-16 g++-12

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build -DWARNINGS_AS_ERRORS=ON

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build
      run: cmake ${{runner.workspace}}/logging -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -G Ninja -DWARNINGS_AS_ERRORS=ON

    - name: Build
      working-directory: ${{runner.workspace}}/build
      run: cmake --build . --parallel $($NPROC) -DWARNINGS_AS_ERRORS=ON

    - name: Test
      working-directory: ${{runner.workspace}}/build
      run: ctest -j $($NPROC) --output-on-failure

  thread-sanitizer:
    name: Ubuntu 24.04 Clang 16 [ThreadSanitizer]
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set Up Dependencies
      run: sudo apt install -y cmake ninja-build pkg-config clang-16

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build-tsan -DWARNINGS_AS_ERRORS=ON

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build-tsan
      run: cmake ${{runner.workspace}}/logging -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-16 -DTHREAD_SANITIZER=ON -G Ninja -DWARNINGS_AS_ERRORS=ON

    - name: Build
      working-directory: ${{runner.workspace}}/build-tsan
      run: cmake --build . --parallel 2 -DWARNINGS_AS_ERRORS=ON

    - name: Test
      working-directory: ${{runner.workspace}}/build-tsan
      env:
        TSAN_OPTIONS: halt_on_error=1
      run: ctest --output-on-failure
